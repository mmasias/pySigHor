elem_GMN13"><path d="M219,836.9779 L219,970.92 A0,0 0 0 0 219,970.92 L427,970.92 A0,0 0 0 0 427,970.92 L427,846.9779 L417,836.9779 L327,836.9779 L323,774.3579 L319,836.9779 L219,836.9779 A0,0 0 0 0 219,836.9779 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M417,836.9779 L417,846.9779 L427,846.9779 L417,836.9779 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135" x="225" y="855.8749">Variante distribuida de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155" x="225" y="873.5809">despliegue-objetivo.puml:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182" x="225" y="891.287">separa el escalado de frontend</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="225" y="908.993">y backend en hosts distintos.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187" x="225" y="926.699">El CORS deja de ser same-origin</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170" x="225" y="944.405">y pasa a ser cross-origin real.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="113" x="225" y="962.111">A&#250;n no construida.</text></g><!--link Administrador to spa--><g id="link_Administrador_spa"><path d="M323,124.8879 C323,169.7279 323,236.5879 323,277.2879 " fill="none" id="Administrador-to-spa" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="323,283.2879,327,274.2879,323,278.2879,319,274.2879,323,283.2879" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="66" x="324" y="169.5349">HTTPS :443</text></g><!--link spa to api-->