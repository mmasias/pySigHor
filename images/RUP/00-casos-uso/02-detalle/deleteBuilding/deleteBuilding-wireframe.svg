<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="319px" preserveAspectRatio="none" style="width:402px;height:319px;background:#FFFFFF;" version="1.1" viewBox="0 0 402 319" width="402px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="109" x="6" y="18.8281">DELETE BUILDING</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="395" y1="26.8441" y2="26.8441"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="395" y1="28.8441" y2="28.8441"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="275" x="7" y="46.1722">Are you sure you want to delete this building?</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="394" y1="55.1882" y2="55.1882"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="33" x="9" y="74.5163">Code:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="51" x="50" y="74.5163">EDIF-001</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="39" x="9" y="92.8604">Name:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89" x="50" y="92.8604">Central Building</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="54" x="9" y="113.2045">Location:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="105" x="83" y="113.2045">University Campus</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="72" x="9" y="131.5487">Description:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136" x="83" y="131.5487">Main classroom building</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="83" x="9" y="151.8928">Observations:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219" x="95" y="152.8928">Building with large capacity classrooms</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207" x="95" y="171.2369">for lecture courses. Features modern</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="129" x="95" y="189.581">audiovisual equipment.</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="136" x="9" y="210.9251">Associated classrooms:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="142" x="147" y="210.9251">15 registered classrooms</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="86" x="9" y="229.2692">Total capacity:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="72" x="147" y="229.2692">850 students</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="8" x2="393" y1="239.2853" y2="239.2853"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="232" x="8" y="256.6133">&#9888;&#65039; WARNING: This action is irreversible</text><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="384" x="8" y="274.9575">The building and all associated information will be permanently deleted</text><line style="stroke:#AAAAAA;stroke-width:1.5;" x1="7" x2="394" y1="284.9735" y2="284.9735"/><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="132" x="10.5" y="292.9735"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93" x="30" y="307.8016">Confirm deletion</text><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="52" x="149.5" y="292.9735"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="38" x="156.5" y="307.8016">Cancel</text><!--SRC=[PLJDKjim4BxhAVO8XmGdXGwJWHHm30DDW0677XWEihr9D6DBgNx2P6XuXTvxwcFqUVe2VOMkZ9rWeejNqhVVxdwxyecnN5l3SmiPvcZnp8ay4tBQUXOQ9veNo5uOq3fA-eDe6CKHd8qlXuFBwukZlQHVNXqV7vVVDs05FjK8I-N0kCfuvjA2LLKSi3DX8AcYVLbp-TLghSqDPRaZtb1bsFDm-07HuFAy5GIT1eWmrvHsZGbHMirpg0jRRJ4ELSgjKBBs64knG6s4NKB8Yxap7-a7Q58jvkzzHbn8I7DkZ5QgMDUr7UmcCQWNPJnJEJSnZPrVTUBmBEmCSgwd22cVyzGdk0vfjlmcIaEEgVNwfyffWwODvyZzWO62PDHooucxJAY5C8uKm-zEp0kIhzs0hRQBEZL6fO9RpDubL4lJEG2DKs4iwiRzHrLZPIbeNLdjVNWGWB4kepHCC_2xAQaO_lxw_U_FJ_XsUdTDuzc3s8yOJxtMG9RG6il69Zasvgrq5_ruXkl60PSPy3m7lYbDI9AqA5j7lQ2x166ET28fkNnP3NPsj2Ssr2ksDbzVD_RBOwZaHEZYpOaOdwZMnv3B5FEdjpfNRCLEK6R-SJ9sczFp6O-6K5P06NJQtQ2xt_wq4yySjJNnEdU3tdxG2muWZ6Bmrxjiv-9skEY2eG584J9gWnQ9yn5tsHLVSBXpqWfwBd0pHtar-5eVG2GNGYlf1u1TFOmsWC_xhJDXuPxc63KyZDW09zpH7oIIgVBYzM0SdxSEsP3BgUDJuaR3GaMyUjc3wFu_]--></g></svg>