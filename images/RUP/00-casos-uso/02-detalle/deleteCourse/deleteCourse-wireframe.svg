<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="317px" preserveAspectRatio="none" style="width:393px;height:317px;background:#FFFFFF;" version="1.1" viewBox="0 0 393 317" width="393px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="163" x="6" y="18.8281">DELETE ACADEMIC COURSE</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="386" y1="26.8441" y2="26.8441"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="386" y1="28.8441" y2="28.8441"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="262" x="7" y="46.1722">Are you sure you want to delete this course?</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="385" y1="55.1882" y2="55.1882"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="33" x="9" y="74.5163">Code:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="49" x="50" y="74.5163">CUR-001</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="39" x="9" y="92.8604">Name:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="113" x="50" y="92.8604">Differential Calculus</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="72" x="9" y="113.2045">Description:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="277" x="84" y="114.2045">Fundamental mathematics course that introduces</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="258" x="84" y="132.5487">concepts of limits, derivatives and applications</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="123" x="84" y="150.8928">of differential calculus</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="46" x="9" y="172.2369">Credits:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="7" x="154" y="172.2369">4</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="143" x="9" y="190.581">Theoretical hours/week:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="7" x="154" y="190.581">3</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="128" x="9" y="208.9251">Practical hours/week:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="7" x="154" y="208.9251">2</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="116" x="9" y="227.2692">Academic program:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="197" x="154" y="227.2692">Industrial and Systems Engineering</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="8" x2="384" y1="237.2853" y2="237.2853"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="232" x="8" y="254.6133">&#9888;&#65039; WARNING: This action is irreversible</text><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="375" x="8" y="272.9575">The course and all associated information will be permanently deleted</text><line style="stroke:#AAAAAA;stroke-width:1.5;" x1="7" x2="385" y1="282.9735" y2="282.9735