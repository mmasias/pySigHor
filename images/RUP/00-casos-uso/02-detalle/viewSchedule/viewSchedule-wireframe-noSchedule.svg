<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="344px" preserveAspectRatio="none" style="width:345px;height:344px;background:#FFFFFF;" version="1.1" viewBox="0 0 345 344" width="345px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="165" x="6" y="18.8281">VIEW ACADEMIC SCHEDULE</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="338" y1="26.8441" y2="26.8441"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="338" y1="28.8441" y2="28.8441"/><text fill="#FFA500" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="158" x="6" y="45.1722">&#128197; NO SCHEDULE AVAILABLE</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="338" y1="53.1882" y2="53.1882"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="338" y1="55.1882" y2="55.1882"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="235" x="6" y="71.5163">The system has no generated schedule.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198" x="6" y="89.8604">To generate an academic schedule:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240" x="6" y="108.2045">1. Configure at least 1 course in the system</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150" x="6" y="126.5487">2. Assign at least 1 teacher</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218" x="6" y="144.8928">3. Define at least 1 available classroom</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="331" x="6" y="163.2369">4. Use the "Generate Schedule" option from the main menu</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="338" y1="171.2529" y2="171.2529"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="338" y1="173.2529" y2="173.2529"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="135" x="6" y="189.581">Current system status:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="130" x="6" y="207.9251">&#8226; Configured courses: 4</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124" x="6" y="226.2692">&#8226; Available teachers: 3</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="139" x="6" y="244.6133">&#8226; Available classrooms: 2</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124" x="6" y="262.9575">&#8226; Defined resources: 8</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="338" y1="270.9735" y2="270.9735"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="338" y1="272.9735" y2="272.9735"/><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="116" x="8.5" y="278.9735"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="80" x="26.5" y="293.8016">Back to Menu</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="338" y1="306.3176" y2="306.3176"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="338" y1="308.3176" y2="308.3176"/><text fill="#000000" font-family="sans-serif" font-size="9" font-style="italic" lengthAdjust="spacing" textLength="177" x="6" y="321.4387">Once the schedule is generated, you can view it</text><text fill="#000000" font-family="sans-serif" font-size="9" font-style="italic" lengthAdjust="spacing" textLengt