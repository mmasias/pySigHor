<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="319px" preserveAspectRatio="none" style="width:398px;height:319px;background:#FFFFFF;" version="1.1" viewBox="0 0 398 319" width="398px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="101" x="6" y="18.8281">DELETE TEACHER</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="391" y1="26.8441" y2="26.8441"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="391" y1="28.8441" y2="28.8441"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="268" x="7" y="46.1722">Are you sure you want to delete this teacher?</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="390" y1="55.1882" y2="55.1882"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="33" x="9" y="74.5163">Code:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="54" x="50" y="74.5163">PROF-001</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="39" x="9" y="92.8604">Name:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="139" x="50" y="92.8604">Juan Carlos Garc&#237;a L&#243;pez</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="37" x="9" y="113.2045">Email:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="138" x="52" y="113.2045">jgarcia@universidad.edu</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="41" x="9" y="131.5487">Phone:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93" x="52" y="131.5487">+51 999 123 456</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="83" x="9" y="151.8928">Observations:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185" x="95" y="152.8928">Specialized teacher in algorithms</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="177" x="95" y="171.2369">and data structures. Experience</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="209" x="95" y="189.581">in educational software development.</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="106" x="9" y="210.9251">Assigned courses:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="90" x="117" y="210.9251">3 active courses</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="74" x="9" y="229.2692">Preferences:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217" x="117" y="229.2692">Configured (classrooms with projector)</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="8" x2="389" y1="239.2853" y2="239.2853"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="232" x="8" y="256.6133">&#9888;&#65039; WARNING: This action is irreversible</text><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="380" x="8" y="274.9575">The teacher and all associated information will be permanently deleted</text><line style="stroke:#AAAAAA;stroke-width:1.5;" x1="7" x2="390" y1="284.9735" y2="284.9735"/><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="132" x="10.5" y="292.9735"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93" x="30" y="307.8016">Confirm deletion</text><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="52" x="149.5" y="292.9735"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="38" x="156.5" y="307.8016">Cancel</text><!--SRC=[PLHBKjj04Dth5Bs4IjdOngQ22mYE40J7WCi8ig1OjAIsFTHenZKpiWF4N27xh7A1hBB9dfla0hb2Ml8lZcUZbkRrwzTlUdHi7HfdKJf8I9AZa30UaYbDXA6-mPIyPmzu7KH79q4d20C8WvR_8UWTx4H7nSxXuM7ndE7cs9OXUDGPs6mUJ50vS7fU1TnGM72pMk-MLFagbPRXYh5uOrfV9zJCuV05khshqrAbKbq3CUQIHIymxGmL-6Yajd269dxzWT1v_JcYf-a6Tv2Ya8l4Xm6Z1HvdIep9M95WKgOa-xzMTwZLijYRHXNsz_UXMjk5UcDliy9LPCcCqGcjx3nf7RFsbg_h4R4AAPueMRW5GW7AWJR23LExaO4gWGGTWdKcYntRRyiGV1wH4QHYsi0p6_SL5w9GWjLzDq4-iuJ69FKe9UNAQqdJpRvQreg1OecnpeobHM-m2nWxzc_nVSCz7Z4okQnbYgzLNmnOTG9RiKHhZTQfXGat2oEZ7oXsscolI_XdOkR4lxzz__FhAtngzIxFBy-Q4ERJbclH2ZWInb1ngf6ajTahqiLHEAIbsxcVA2Mm5Cr7uLYOK7rjqi8n5iPx4G7xcw9Yi-JZVCIJWnsnOfvwo_3bPHK_tnKDctIMn8ptRCATZ-o9l9-rEVMctZ6f9B-adjULV95kBZfGDC0AgkLQfLOlxsw5mmnEAO9g0sgLPhtIh3J03qB8jxUzhRDkPrpZyyrCpAShU3n4bEKLjxqsZX5wcNA2RmvSZKYrJpukFa2Wni9ebK-2rxwzM07swgNtmi4rppGRTNlXdL0VC_wJ12hMYL239jo4fwMtNWVL8CC1S_CC-9fvpMCJWkk_]--></g></svg>