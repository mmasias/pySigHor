<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="319px" preserveAspectRatio="none" style="width:413px;height:319px;background:#FFFFFF;" version="1.1" viewBox="0 0 413 319" width="413px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="123" x="6" y="18.8281">DELETE CLASSROOM</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="406" y1="26.8441" y2="26.8441"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="406" y1="28.8441" y2="28.8441"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="283" x="7" y="46.1722">Are you sure you want to delete this classroom?</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="7" x2="405" y1="55.1882" y2="55.1882"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="33" x="9" y="74.5163">Code:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="56" x="50" y="74.5163">AULA-001</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="39" x="9" y="92.8604">Name:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93" x="50" y="92.8604">Main Auditorium</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="55" x="9" y="113.2045">Building:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89" x="66" y="113.2045">Central Building</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="55" x="9" y="131.5487">Capacity:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="72" x="66" y="131.5487">120 students</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="32" x="9" y="151.8928">Type:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="65" x="74" y="151.8928">Lecture hall</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="63" x="9" y="170.2369">Resources:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111" x="74" y="170.2369">Projector, Audio, AC</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="83" x="9" y="190.581">Observations:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="203" x="95" y="191.581">Large capacity classroom for special</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169" x="95" y="209.9251">events and lectures. Complete</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="182" x="95" y="228.2692">audiovisual equipment available.</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="8" x2="404" y1="239.2853" y2="239.2853"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="232" x="8" y="256.6133">&#9888;&#65039; WARNING: This action is irreversible</text><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="395" x="8" y="274.9575">The classroom and all associated information will be permanently deleted</text><line style="stroke:#AAAAAA;stroke-width:1.5;" x1="7" x2="405" y1="284.9735" y2="284.9735"/><rect fill="#EEEEEE" height="20.3441" rx