<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="297px" preserveAspectRatio="none" style="width:360px;height:297px;background:#FFFFFF;" version="1.1" viewBox="0 0 360 297" width="360px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="129" x="6" y="18.8281">GENERATE SCHEDULE</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="353" y1="26.8441" y2="26.8441"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="353" y1="28.8441" y2="28.8441"/><text fill="#FF0000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="134.375" x="6" y="45.1722">&#10060; INSUFFICIENT DATA</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="353" y1="53.1882" y2="53.1882"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="353" y1="55.1882" y2="55.1882"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="346" x="6" y="71.5163">The system requires minimum data to generate schedule:</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="353" y1="80.5323" y2="80.5323"/><text fill="#FF0000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212" x="6" y="97.8604">&#10007; Courses: 0 configured (minimum: 1)</text><text fill="#008000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208" x="6" y="116.2045">&#10003; Teachers: 3 available (minimum: 1)</text><text fill="#008000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222" x="6" y="134.5487">&#10003; Classrooms: 2 available (minimum: 1)</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="353" y1="143.5647" y2="143.5647"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="139" x="6" y="160.8928">Recommended actions:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235" x="6" y="179.2369">&#8226; Configure at least 1 course in the system</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="266" x="6" y="197.581">&#8226; Verify that the course has an assigned teacher</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222" x="6" y="215.9251">&#8226; Ensure there are available classrooms</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="353" y1="223.9411" y2="223.9411"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="353" y1="225.9411" y2="225.9411"/><rect fill="#EEEEEE" height="20.3441" rx="5" ry="5" style="stroke:#000000;stroke-width:2.5;" width="100" x="8.5" y="231.9411"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="70" x="23.5" y="246.7692">Understood</text><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="353" y1="259.2853" y2="259.2853"/><line style="stroke:#AAAAAA;stroke-width:1.0;" x1="6" x2="353" y1="261.2853" y2="261.2853"/><text fill="#000000" font-family="sans-serif" font-size="9" font-style="italic" lengthAdjust="spacing" textLength="133" x="6" y="274.4063">Once minimum data is configured,</text><text fill="#000000" font-family="sans-serif" font-size="9" font-style="italic" lengthAdjust="spacing" textLength="199" x="6" y="288.6644">you can generate the schedule from the main menu.</text><!--SRC=[bLDDRzD04BtxLymnaN2-cYAmWjMGEAKXIQl4oGLnMDjZPoLx5_OZA20aVW0t3bpWma_BBs6SkcwJ4woqbvrvC- -zcRtIXYcZMMuWGu6A6Lp5MqniZkudhZ1Lh42N2stJbCSSXN6-E41d4FdNmI9O3iC0LgCtmNWz2mRjo3y6Nz6vpufbBfMdCF49SFZz7MuMg_LaSZEw2HOXZ8VXi0GDsiUySt3aXri4lTS62r3uqH8X3GKNlB059CmmCBBc3ReYxjKyNFUSnU7NJnX9gpHg3peGIv7op5846bLT3xhD4puLEbE8Wl0_84H6dHGLk02sOpndKOx_WH_bJ6ibP