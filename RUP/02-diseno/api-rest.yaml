  # ===== ALGORITMO DE GENERACIÓN DE HORARIOS =====

  /horarios/generar:
    post:
      tags: [Horarios]
      summary: Generar horario (generarHorario)
      description: |
        Implementa el caso de uso `generarHorario()` del análisis RUP.
        Ejecuta el algoritmo de optimización de 4 fases:
        
        1. **PrepararH()** - Resolución de conflictos de horarios
        2. **GeneraPreHorario()** - Optimización dual (capacidad + compatibilidad)  
        3. **GeneraHorario()** - Materialización del horario final
        4. **IngresoHE()** - Manejo de casos especiales (HE, HV)
        
        **Estados RUP:**
        - Entrada: MENU_PRINCIPAL
        - Estados intermedios: GENERANDO_HORARIO
        - Salida: MENU_PRINCIPAL (con horario generado)
        
        **Procesamiento asíncrono:** Este endpoint puede tomar varios minutos
        para procesar todos los cursos. Se recomienda implementar polling
        o WebSockets para seguimiento del progreso.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerarHorarioRequest'
            example:
              programaIds: [1, 2]
              forzarRegeneracion: false
              configuracion:
                prioridadCapacidad: 0.6
                permitirHorariosEspeciales: true
                maximoConflictos: 5
      responses:
        '200':
          description: Generación de horario completada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerarHorarioResponse'
              example:
                exitoso: true
                mensaje: "Horario generado exitosamente"
                estadisticas:
                  totalCursos: 15
                  cursosAsignados: 14
                  conflictosResueltos: 3
                  tiempoEjecucion: 2500
                  faseCompletada: "IngresoHE"
                sessionId: "123e4567-e89b-12d3-a456-426614174000"
                fechaGeneracion: "2025-01-13T10:45:00Z"
        '400':
          description: Error en parámetros de generación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del algoritmo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Error en fase GeneraPreHorario: No se encontraron aulas disponibles"
                error: "ALGORITHM_ERROR"
                timestamp: "2025-01-13T10:45:00Z"

  # ===== CONSULTA DE HORARIOS =====

  /horarios:
    get:
      tags: [Horarios]
      summary: Consultar horarios (consultarHorario)
      description: |
        Implementa el caso de uso `consultarHorario()` del análisis RUP.
        Permite consultas con diferentes filtros y formatos de visualización.
        
        **Estados RUP:**
        - Entrada: MENU_PRINCIPAL
        - Salida: CONSULTANDO_HORARIOS
        
        **Tipos de consulta:**
        - Por profesor: Horario personal de un docente
        - Por aula: Ocupación de un espacio físico
        - Por programa: Horarios de un programa académico
        - General: Vista completa del horario institucional
      parameters:
        - name: profesorId
          in: query
          schema:
            type: integer
            format: int64
          description: Filtrar por profesor específico
        - name: aulaId  
          in: query
          schema:
            type: integer
            format: int64
          description: Filtrar por aula específica
        - name: programaId
          in: query
          schema:
            type: integer
            format: int64
          description: Filtrar por programa académico
        - name: bloqueHorario
          in: query
          schema:
            type: string
            enum: [H1, H2, H3, H4, H5, H6, H7, H8, HE, HV]
          description: Filtrar by bloque horario
        - name: fechaGeneracion
          in: query
          schema:
            type: string
            format: date
          description: Filtrar por fecha de generación (formato YYYY-MM-DD)
        - name: formato
          in: query
          schema:
            type: string
            enum: [tabla, calendario, grid]
            default: tabla
          description: Formato de respuesta
      responses:
        '200':
          description: Horarios encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Horario'
              example:
                - id: 1
                  profesorId: 1
                  cursoId: 1
                  aulaId: 6
                  profesor:
                    codigo: "P001"
                    nombres: "Juan Carlos"  
                    apellidos: "García Mendoza"
                  curso:
                    codigo: "PI101"
                    nombre: "Introducción a la Programación"
                  aula:
                    codigo: "B101"
                    nombre: "Lab Sistemas 1"
                  bloqueHorario: "H1"
                  diasSemana: "LXV"
                  horaInicio: "07:00"
                  horaFin: "08:00"
                  puntuacionCompatibilidad: 100.0
                  fechaGeneracion: "2025-01-13T10:45:00Z"

  /horarios/estadisticas:
    get:
      tags: [Horarios]
      summary: Estadísticas del horario generado
      description: Métricas y estadísticas de la última generación de horarios
      responses:
        '200':
          description: Estadísticas del horario
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalHorarios:
                    type: integer
                    description: Total de horarios generados
                  ocupacionAulas:
                    type: object
                    additionalProperties:
                      type: number
                      format: decimal
                    description: Porcentaje de ocupación por aula
                  cargaDocente:
                    type: object
                    additionalProperties:
                      type: integer
                    description: Horas asignadas por profesor
                  distribucionBloques:
                    type: object
                    additionalProperties:
                      type: integer
                    description: Cantidad de cursos por bloque horario
                  puntuacionPromedio:
                    type: number
                    format: decimal
                    description: Puntuación promedio de compatibilidad

